name: CI

on:
  push:
    branches: [development]
  pull_request:
    branches: [development]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify showcase structure and runtime contract
        run: |
          test -f AGENTS.md
          test -f README.md
          test -f .anclora/PRODUCTION_RUNTIME.md
          test -d docs
          test -d public

